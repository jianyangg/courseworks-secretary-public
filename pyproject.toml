[project]
name = "courseworks-secretary"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.117.1",
  "uvicorn==0.35.0",
  "vercel @ git+https://github.com/vercel/vercel-py.git@vercel-v0.10.0#subdirectory=src/vercel",
]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[tool.vercel]
entrypoint = "api.index:app"

[tool.setuptools.packages.find]
include = ["courseworks_secretary*", "api*"]
